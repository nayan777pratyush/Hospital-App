<template>

    <div class="main-container">

        <div class="dashboard-card">

            <h1 class="title">🏥 Appointment Dashboard</h1>

            <div class="center-btn">
                <lightning-button 
                    label="New Appointment" 
                    variant="brand" 
                    onclick={openModal}>
                </lightning-button>
            </div>

        </div>

        <div class="stats-container">

    <div class="stat-card total">
        <p>Total</p>
        <h2>{totalAppointments}</h2>
    </div>

    <div class="stat-card pending">
        <p>Pending</p>
        <h2>{pendingAppointments}</h2>
    </div>

    <div class="stat-card confirmed">
        <p>Confirmed</p>
        <h2>{confirmedAppointments}</h2>
    </div>

</div>

<div class="filter-container">
    <lightning-input
        type="text"
        placeholder="Search by Appointment / Doctor"
        onchange={handleSearch}>
    </lightning-input>

    <lightning-combobox
        value={filterStatus}
        options={statusFilterOptions}
        onchange={handleFilter}>
    </lightning-combobox>
</div>
        <!-- MODAL -->
        <template if:true={isModalOpen}>
            <section class="custom-modal">
                <div class="modal-container">

                    <h2>Create Appointment</h2>

                    <!-- DROPDOWNS (IMPROVED UX) -->
                    <lightning-combobox
                        label="Patient"
                        value={patientId}
                        options={patientOptions}
                        onchange={handlePatient}>
                    </lightning-combobox>

                    <lightning-combobox
                        label="Doctor"
                        value={doctorId}
                        options={doctorOptions}
                        onchange={handleDoctor}>
                    </lightning-combobox>

                    <lightning-input 
                        type="date" 
                        label="Date" 
                        value={date}
                        onchange={handleDate}>
                    </lightning-input>

                    <lightning-combobox 
                        label="Status"
                        value={status}
                        options={statusOptions}
                        onchange={handleStatus}>
                    </lightning-combobox>

                    <div class="modal-buttons">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={saveAppointment}></lightning-button>
                    </div>

                </div>
            </section>
        </template>

        <lightning-card title="Appointments List" icon-name="standard:appointment">

            <div class="slds-p-around_medium">

             <lightning-datatable
                key-field="Id"
                data={filteredAppointments}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column>
              </lightning-datatable>

            </div>

        </lightning-card>

    </div>

</template>
