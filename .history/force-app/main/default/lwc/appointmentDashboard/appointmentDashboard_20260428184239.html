<template>

    <div class="main-container">

        <div class="dashboard-card">

            <h1 class="title">🏥 Appointment Dashboard</h1>

            <div class="center-btn">
                <lightning-button 
                    label="New Appointment" 
                    variant="brand" 
                    onclick={openModal}>
                </lightning-button>
            </div>

        </div>

        <!-- MODAL -->
        <template if:true={isModalOpen}>
            <section class="custom-modal">
                <div class="modal-container">

                    <h2>Create Appointment</h2>

                    <!-- DROPDOWNS (IMPROVED UX) -->
                    <lightning-combobox
                        label="Patient"
                        value={patientId}
                        options={patientOptions}
                        onchange={handlePatient}>
                    </lightning-combobox>

                    <lightning-combobox
                        label="Doctor"
                        value={doctorId}
                        options={doctorOptions}
                        onchange={handleDoctor}>
                    </lightning-combobox>

                    <lightning-input 
                        type="date" 
                        label="Date" 
                        value={date}
                        onchange={handleDate}>
                    </lightning-input>

                    <lightning-combobox 
                        label="Status"
                        value={status}
                        options={statusOptions}
                        onchange={handleStatus}>
                    </lightning-combobox>

                    <div class="modal-buttons">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={saveAppointment}></lightning-button>
                    </div>

                    <lightning-card title="Appointments List" icon-name="standard:appointment">

    <div class="slds-p-around_medium">

        <lightning-datatable
            key-field="Id"
            data={appointments}
            columns={columns}
            hide-checkbox-column>
        </lightning-datatable>

    </div>

</lightning-card>

                </div>
            </section>
        </template>

    </div>

</template>
